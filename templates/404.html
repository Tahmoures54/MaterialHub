{% extends "base.html" %}

{% block title %}Page Not Found - MaterialHub{% endblock %}

{% block content %}
<div class="container text-center py-5">

    <h2 class="mb-3">Page Not Found</h2>

        Back to Home

</div>
{% endblock %}
