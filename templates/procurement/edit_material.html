{% extends "base.html" %}
{% block content %}
<div class="edit-material-page">
    <header class="edit-material-header">
        <h1>Edit Material</h1>
        <p>Update the details for "{{ material.name }}"</p>
    </header>

    <section class="edit-material-section">
        <form method="POST" action="{{ url_for('edit_material', material_id=material.id) }}" class="edit-material-form">
            <div class="form-field">
                <label for="name">Material Name</label>
                <input type="text" id="name" name="name" value="{{ material.name }}" required placeholder="Enter material name">
            </div>
            <div class="form-field">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" value="{{ material.quantity }}" required placeholder="Enter quantity">
            </div>
            <div class="form-field">
                <label for="price">Price ($)</label>
                <input type="number" step="0.01" id="price" name="price" value="{{ material.price }}" required placeholder="Enter price">
            </div>
            <div class="form-field link-field">
                <label for="link">Material Link (Optional)</label>
                <input type="url" id="link" name="link" value="{{ material.link if material.link else '' }}" placeholder="e.g., https://example.com/material.jpg">
                {% if material.link %}
                    <div class="link-preview">
                        {% if material.link.endswith(('.jpg', '.jpeg', '.png')) %}
                            <img src="{{ material.link }}" alt="{{ material.name }}" onerror="this.style.display='none';">
                        {% else %}
                            <a href="{{ material.link }}" target="_blank" class="view-link-btn">View Link</a>
                        {% endif %}
                    </div>
                {% endif %}
            </div>
            <div class="form-actions">
                <button type="submit" class="save-btn">Save Changes</button>
                <a href="{{ url_for('supplier.supplier_dashboard') }}" class="cancel-btn">Cancel</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
