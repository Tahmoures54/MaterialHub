{% extends "base.html" %}
{% block title %}Smart Receiving{% endblock %}
{% block content %}
<div style="max-width:900px;margin:auto"><h1>Smart Receiving</h1><p>PO <b>{{ po.order_no }}</b> · Expected quantity: <b>{{ expected_qty }}</b></p>
<form method="post" style="background:#fff;padding:22px;border:1px solid #e2e8f0;border-radius:16px">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Receipt No</label><input name="receipt_no" required class="form-control mb-3">
<label>Received Quantity</label><input name="received_qty" type="number" step="0.001" min="0" required class="form-control mb-3">
<label>Accepted Quantity</label><input name="accepted_qty" type="number" step="0.001" min="0" required class="form-control mb-3">
<label>Invoice No</label><input name="invoice_no" required class="form-control mb-3">
<label>Invoice Amount</label><input name="invoice_amount" type="number" step="0.01" min="0" required class="form-control mb-3">
<button class="btnx" type="submit">Record & Run Match</button>
<a class="btn btn-secondary" href="{{ url_for('operations_copilot.dashboard') }}">Cancel</a>
</form></div>
{% endblock %}
