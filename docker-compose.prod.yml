services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in environment}
      POSTGRES_USER: ${POSTGRES_USER:?set in environment}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
  web:
    build:
      context: .
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      FLASK_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENCODED}@db:5432/${POSTGRES_DB}
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-10485760}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    expose: ["8000"]
    networks: [backend]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80","443:443"]
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    secrets: [tls_cert,tls_key]
    networks: [edge,backend]
secrets:
  postgres_password: {file: ./secrets/postgres_password}
  tls_cert: {file: ./secrets/tls_cert}
  tls_key: {file: ./secrets/tls_key}
volumes:
  postgres_data:
  redis_data:
networks:
  edge:
  backend:
    internal: true
