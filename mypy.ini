[mypy]
python_version = 3.12
ignore_missing_imports = true
explicit_package_bases = true

# The application uses Flask-SQLAlchemy's dynamic db.Model declaration style.
# Keep strict type checking on application/config/blueprint code while excluding
# the legacy declarative model modules whose dynamic ORM API is not understood
# reliably by mypy without a full SQLAlchemy typed-model migration.
[mypy-models]
ignore_errors = true

[mypy-models_intelligence]
ignore_errors = true
