events {}
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","request":"$request","status":$status,"request_time":$request_time,"upstream_response_time":"$upstream_response_time"}';
  access_log /dev/stdout json;
  error_log /dev/stderr warn;
  upstream materialhub { server web:8000; }
  server { listen 80; server_name _; return 301 https://$host$request_uri; }
  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    location / {
      proxy_pass http://materialhub;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 10s;
      proxy_read_timeout 120s;
      client_max_body_size 10m;
    }
  }
}
