name: OPERA Phase 1 validation

on:
  pull_request:
    branches: [main]
    paths:
      - "models.py"
      - "models_commissioning.py"
      - "services/commissioning_number_service.py"
      - "migrations/versions/20261116_0019_commissioning_foundation.py"
      - "scripts/seed_commissioning_demo.py"
      - ".github/workflows/opera-phase1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migration-and-seed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: opera_phase1
          POSTGRES_USER: opera
          POSTGRES_PASSWORD: opera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opera -d opera_phase1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FLASK_ENV: production
      SECRET_KEY: opera-phase1-ci-only-secret-key-materialhub-2026
      DATABASE_URL: postgresql://opera:opera@127.0.0.1:5432/opera_phase1
      RATELIMIT_STORAGE_URI: redis://127.0.0.1:6379/0
      SEED_COMMISSIONING_DEMO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Apply all Alembic migrations
        run: |
          flask --app wsgi db upgrade
          flask --app wsgi db current
      - name: Seed OPERA demonstration data
        run: python scripts/seed_commissioning_demo.py
      - name: Verify demo dataset
        run: |
          python - <<'PY'
          from app import create_app
          from models import Project
          from models_commissioning import (
              Certificate, CertificateStatus, CheckSheet, CheckSheetType,
              CommissioningSubsystem, CommissioningSystem, CommissioningTag, PunchItem,
          )

          app = create_app("production")
          with app.app_context():
              project = Project.query.filter_by(
                  project_no="OPERA-DEMO-001", company_name="OPERA Demo EPC"
              ).one()
              assert CommissioningSystem.query.filter_by(project_id=project.id).count() == 2
              assert CommissioningSubsystem.query.count() == 3
              assert CommissioningTag.query.count() == 10
              assert CheckSheet.query.filter_by(sheet_type=CheckSheetType.A).count() == 5
              assert CheckSheet.query.filter_by(sheet_type=CheckSheetType.B).count() == 5
              assert CheckSheet.query.filter_by(sheet_type=CheckSheetType.C).count() == 3
              assert PunchItem.query.count() == 8
              assert Certificate.query.filter_by(
                  cert_type="MC", status=CertificateStatus.ISSUED
              ).count() == 1
              assert Certificate.query.filter_by(
                  cert_type="RFC", status=CertificateStatus.PENDING
              ).count() == 1
              print("OPERA Phase 1 PostgreSQL migration and seed verification passed.")
          PY
