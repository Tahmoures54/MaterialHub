name: MaterialHub CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check . --select E4,E7,E9,F --ignore E401,E402,E701,E702,F401
      - name: Mypy
        run: mypy --config-file mypy.ini app.py extensions.py config blueprints role_workspace.py utils.py
      - name: Pytest with core coverage
        run: pytest --cov=app.py --cov=blueprints/health.py --cov=blueprints/growth.py --cov=config/config.py --cov=extensions.py --cov=forms --cov=models.py --cov=models_intelligence.py --cov=errors.py --cov=data/country_codes.py --cov-report=term-missing --cov-fail-under=80
      - name: Bandit
        run: bandit -r . -x ./tests,./migrations
      - name: pip-audit
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f Dockerfile.production -t materialhub:ci .
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: materialhub:ci
          format: json
          output: trivy-report.json
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
      - name: Report Trivy findings to PR (diagnostic)
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          trivy image --severity HIGH,CRITICAL materialhub:ci --format json > trivy.json 2>/dev/null || true
          {
            echo "### Trivy scan findings (HIGH,CRITICAL) on materialhub:ci"
            echo ""
            python3 - <<'PYEOF'
          import json
          try:
              data = json.load(open("trivy.json"))
          except Exception:
              print("_trivy did not produce a report_")
              raise SystemExit(0)
          rows = []
          for r in data:
              for res in r.get("Results", []) or []:
                  for v in res.get("Vulnerabilities", []) or []:
                      rows.append(
                          "| {id} | {sev} | {tgt} | {fix} |".format(
                              id=v.get("VulnerabilityID"),
                              sev=v.get("Severity"),
                              tgt=res.get("Target", "?"),
                              fix=(v.get("PatchedVersion") or {}).get("PatchedVersion") or "unfixed",
                          )
                      )
          if rows:
              print("| ID | Severity | Target | Fixed in |")
              print("|----|----------|--------|----------|")
              print("\n".join(rows))
          else:
              print("No HIGH/CRITICAL findings.")
          PYEOF
          } > trivy-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --repo "$GITHUB_REPOSITORY" --body-file trivy-comment.md
